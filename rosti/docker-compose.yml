services:
  app:
    image: app:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      # Reading saves: story.json plus its audio/ and images/ bundle.
      - stories:/app/stories
      # The single prepared next story; regenerating one costs a full story.
      - reading-openings:/app/reading-openings
      # Prepared typing openings.
      - openings:/app/openings
      # Word log and learner profile — the adaptation chain's memory.
      - learner:/app/learner
      # Caches. Every entry is a provider call already paid for.
      - word-audio:/app/word-audio
      - story-audio:/app/story-audio
      - story-images:/app/story-images
      - lesson-audio:/app/lesson-audio
      # Legacy flat saves, still read by the saves API.
      - saves:/app/saves
    environment:
      # Text generation is OpenAI/Anthropic; narration, per-word pronunciation,
      # and background images are Gemini. All three are required for a working
      # deployment — see rosti/README.md.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=80

volumes:
  stories:
  reading-openings:
  openings:
  learner:
  word-audio:
  story-audio:
  story-images:
  lesson-audio:
  saves:
